[workspace]
resolver = "2"
members = [
    "crates/coach-core",
    "crates/coach-api",
    "crates/coach-pyo3",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kenichi-Maximilian Pestemer <max.pestemer@gmail.com>"]
repository = "https://github.com/mexxez16/ai-small-modell-coach"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
